<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rig sheet</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { overflow: auto; padding: 24px; background: #061117; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; max-width: 1600px; margin: 0 auto; }
  .cell { border: 1px solid rgba(154,214,224,.2); border-radius: 4px; overflow: hidden; }
  .cell h3 { font: 600 .68rem/1 var(--mono); letter-spacing: .18em; text-transform: uppercase;
             color: #93a9ad; padding: 12px; text-align: center; }
</style></head>
<body>
<div class="row" id="row"></div>
<script type="module">
  import { SCIENTISTS } from './js/data.js';
  import { buildPortrait, trackPointer } from './js/portrait.js';
  document.getElementById('row').innerHTML = SCIENTISTS.map((s) =>
    `<div class="cell">${buildPortrait(s.id, s.accent)}<h3>${s.shortName}</h3></div>`).join('');
  trackPointer(document);
</script>
</body></html>
