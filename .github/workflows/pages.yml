name: Deploy to GitHub Pages

# Manual only. This repo deploys via Vercel; the workflow is kept so GitHub
# Pages stays available as an alternative, but it is not run automatically.
#
# Before the first run, Pages must be switched on by hand at
# Settings -> Pages -> Source -> GitHub Actions. The `enablement` option below
# cannot do it: creating a Pages site needs `administration: write`, which the
# workflow's GITHUB_TOKEN does not carry, and the run fails with
# "Resource not accessible by integration".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
